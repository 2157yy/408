<title>408 流程题复习台</title>
<style>
:root{--ink:#172a3a;--muted:#647686;--blue:#185b83;--teal:#168b88;--line:#dbe5e9;--paper:#fff;--bg:#eff5f7;--warm:#fff6ed;--soft:#e9f4f4;--shadow:0 12px 34px rgba(20,46,63,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;padding:24px 24px 64px}.hero{background:linear-gradient(115deg,#fff 5%,#e9f4f4 100%);border:1px solid var(--line);border-radius:24px;padding:32px 36px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"408";position:absolute;right:36px;top:8px;font-size:120px;font-weight:800;color:rgba(24,91,131,.05);pointer-events:none}.eyebrow{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:7px 0 5px;font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:.01em}.hero p{max-width:780px;margin:10px 0;color:#4b6070}.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.stat{border:1px solid var(--line);background:#ffffffc9;border-radius:14px;padding:8px 13px;color:var(--muted);font-size:13px}.stat b{color:var(--ink);font-size:16px;margin-right:4px}.tabs{display:flex;gap:8px;margin:22px 0 16px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:10px 17px;border-radius:12px;font-weight:700}.tab.active{background:var(--blue);color:white;border-color:var(--blue)}.panel{display:none}.panel.active{display:block}.tools{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(130px,180px)) auto auto;gap:9px;margin:14px 0 12px}.control{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0;color:var(--ink)}.tools button,.action{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--blue);font-weight:700}.tools button:hover,.action:hover{border-color:var(--teal);background:var(--soft)}.statusbar{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:13px;margin:9px 2px 14px}.statusbar a{color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px 18px;box-shadow:0 5px 18px rgba(20,46,63,.035);transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.qid{font-size:17px;font-weight:800;color:var(--blue);letter-spacing:.01em}.tag{display:inline-flex;align-items:center;border-radius:99px;background:#edf5f7;color:#446273;font-size:11px;padding:3px 9px;white-space:nowrap}.tag.recall{background:#fff2e4;color:#a55628}.card h3{font-size:16px;margin:7px 0 5px}.summary{margin:0;color:#536777}.cardactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.openq{font-size:12px;color:var(--blue);text-decoration:none;border-bottom:1px dotted #7ca6bb}.master{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.master input{accent-color:var(--teal);width:16px;height:16px}details{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}details>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-weight:800;cursor:pointer;user-select:none}details>summary::-webkit-details-marker{display:none}details>summary:before{content:"＋";display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;background:var(--soft)}details[open]>summary:before{content:"−"}.answer{padding-top:12px}.answer h4{margin:12px 0 5px;font-size:13px;color:var(--blue)}.answer ol{margin:6px 0 12px;padding-left:22px}.answer li{margin:0 0 8px;padding-left:3px}.answer li b{color:#173c57}.check,.pitfall{border-radius:11px;padding:10px 12px;margin:9px 0;font-size:13px}.check{background:var(--soft);border:1px solid #d3e9e6}.pitfall{background:var(--warm);border:1px solid #f3dfca}.figurestrip{display:flex;gap:8px;overflow:auto;padding:6px 1px 10px}.figurestrip img{height:130px;width:auto;max-width:48%;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px}.flowmini{margin:10px 0 6px;border:1px solid var(--line);border-radius:12px;background:#f8fbfc;padding:5px}.flowmini svg{display:block;width:100%;height:auto}.refline{font-size:12px;color:var(--muted);margin-top:8px}.none{background:#fff;border:1px dashed var(--line);border-radius:14px;text-align:center;padding:32px;color:var(--muted)}
/* animation laboratory */
.labintro{padding:10px 2px;color:var(--muted)}.demogrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.demomenu{background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px;height:max-content;position:sticky;top:12px}.demomenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#536777;border-radius:10px;padding:10px 12px;margin:3px 0}.demomenu button.active{background:var(--soft);color:var(--blue);font-weight:800}.demobox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);min-height:400px}.demobox h2{margin:0 0 4px;font-size:22px}.demohelp{color:var(--muted);font-size:13px;margin:0 0 17px}.demoarea{background:#f8fbfc;border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}.demo-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.demo-controls button{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:10px;padding:8px 13px;font-weight:700}.demo-controls button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.demostatus{margin-top:10px;color:var(--teal);font-weight:700;min-height:25px}.demo-svg{display:block;max-width:100%;height:auto;margin:auto}.node circle{fill:#fff;stroke:#7c9baa;stroke-width:2}.node.active circle{fill:#ffe1bf;stroke:#da7b32;stroke-width:3}.node.fixed circle{fill:#d8f0eb;stroke:#168b88;stroke-width:3}.node text{font-size:13px;fill:#17364b;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#9aabb5;stroke-width:2}.edge.active{stroke:#e58336;stroke-width:4}.frame-row,.page-seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.frame{border:1px solid #bacbd2;background:#fff;border-radius:10px;min-width:54px;height:45px;display:grid;place-items:center;font-weight:800;color:#2c5066;transition:.2s}.frame.active{background:#dff2ee;border-color:var(--teal)}.frame.fault{background:#fff0e1;border-color:#dc7a34}.seqitem{padding:7px 10px;border-radius:9px;background:#eaf0f3;color:#536777;font-weight:700}.seqitem.current{background:#e3f3f0;color:#08716f;outline:2px solid #8bc9bd}.datapath{position:relative;min-height:245px}.dpnode{position:absolute;min-width:82px;text-align:center;border:1px solid #a8bcc6;background:#fff;border-radius:10px;padding:10px 8px;transition:.25s}.dpnode.active{background:#fff0df;border-color:#db8239;box-shadow:0 0 0 4px #ffe8d2}.dpnode.done{background:#e3f2ef;border-color:#4ea99d}.dpnode:nth-child(1){left:4%;top:42%}.dpnode:nth-child(2){left:23%;top:42%}.dpnode:nth-child(3){left:43%;top:42%}.dpnode:nth-child(4){left:63%;top:42%}.dpnode:nth-child(5){left:83%;top:42%}.dparrow{position:absolute;top:52%;height:2px;background:#a7bac3;width:12%;left:13%;transition:.25s}.dparrow:nth-of-type(2){left:32%}.dparrow:nth-of-type(3){left:52%}.dparrow:nth-of-type(4){left:72%}.dparrow.active{background:#e58336;height:4px}.tcp-lanes{display:grid;grid-template-columns:1fr 1fr;gap:25px;position:relative;min-height:230px}.lane{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;padding:10px;font-weight:800;color:var(--blue)}.tcpmsgs{position:absolute;left:8%;right:8%;top:52px;display:grid;gap:34px}.msg{height:24px;position:relative;color:#647686;font-size:12px}.msg:before{content:"";position:absolute;top:11px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0 4%,#c2cfd5 4% 96%,transparent 96%)}.msg span{position:absolute;left:8%;top:-4px;background:#e8f4f3;border:1px solid #b7ddd6;border-radius:7px;padding:2px 8px;transition:left .35s ease}.msg.right span{left:auto;right:8%}.msg.active span{background:#ffe9d5;border-color:#e5a367}.semrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sem{border-radius:12px;background:#fff;border:1px solid var(--line);padding:12px 16px;min-width:140px;text-align:center}.tokens{display:flex;gap:5px;justify-content:center;margin-top:8px}.token{width:14px;height:14px;border-radius:50%;background:#80c5b6}.token.empty{background:#e3eaee}.notice{font-size:12px;color:var(--muted);margin-top:11px}.footer{margin-top:28px;padding:16px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer a{color:var(--blue)}
@media(max-width:950px){.tools{grid-template-columns:1fr 1fr 1fr}.tools input{grid-column:1/-1}.grid{grid-template-columns:1fr}.demogrid{grid-template-columns:1fr}.demomenu{position:static;display:flex;overflow:auto}.demomenu button{white-space:nowrap;width:auto}.hero:after{font-size:85px;right:18px;top:6px}}@media(max-width:580px){.shell{padding:12px 12px 42px}.hero{padding:23px 20px;border-radius:18px}.hero:after{display:none}.tabs{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:4}.tab{flex:1}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.tools button{font-size:12px;padding:8px}.card{padding:14px}.cardhead{align-items:center}.figurestrip img{max-width:80%;height:110px}.demobox{padding:14px}.dpnode{min-width:56px;font-size:11px;padding:8px 3px}.dparrow{width:10%}.dparrow:nth-of-type(2){left:30%}.dparrow:nth-of-type(3){left:50%}.dparrow:nth-of-type(4){left:70%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="hero">
  <div class="eyebrow">2009—2026 · 王道教材图解 · 真题回查</div>
  <h1>408 流程题复习台</h1>
  <p>先自己把每一步写出来，再展开解析。每张卡都有对应图解、逐步方法、答案检查点和原题链接；动画实验室可以慢慢点着看抽象过程。</p>
  <div class="statrow"><div class="stat"><b id="totalStat">200</b>题目卡</div><div class="stat"><b>4</b>门课</div><div class="stat"><b>18</b>个年份</div><div class="stat">2026 † 为公开回忆整理版</div></div>
</header>
<nav class="tabs" aria-label="复习模式"><button class="tab active" data-panel="study">题目复习</button><button class="tab" data-panel="lab">动画实验室</button></nav>
<main>
<section id="study" class="panel active">
  <div class="tools">
    <input id="search" class="control" type="search" placeholder="搜题号、算法、关键词…" aria-label="搜索题目">
    <select id="course" class="control" aria-label="筛选课程"><option value="">全部课程</option></select>
    <select id="year" class="control" aria-label="筛选年份"><option value="">全部年份</option></select>
    <select id="kind" class="control" aria-label="筛选类型"><option value="">全部类型</option><option>单选过程题</option><option>综合题</option><option>算法设计扩展</option><option>存储访问题</option></select>
    <button id="openAll">全部展开</button><button id="closeAll">全部收起</button>
  </div>
  <div class="statusbar"><span id="resultCount">加载题目中…</span><button class="action" id="randomBtn">抽一道</button></div>
  <div class="grid" id="questionGrid"></div>
</section>
<section id="lab" class="panel">
  <p class="labintro">这些是简化的教学动画，帮助你观察“每一步改变了什么”。数值示例来自教材原理图；真题计算仍以题干条件为准。</p>
  <div class="demogrid"><nav class="demomenu" id="demoMenu"></nav><div id="demoPanel" class="demobox"></div></div>
</section>
</main>
<footer class="footer">题库来源：<a href="https://zhenti.beokayy.club/" target="_blank" rel="noreferrer">BOK408历年真题档案</a>。2026†为公开回忆整理版。图解来自用户提供的2027王道四科教材扫描PDF。</footer>
</div>
<script src="data.js"></script>
<script>
(()=>{
const questions=window.QDATA||[];const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grid=$('#questionGrid'), search=$('#search'), course=$('#course'), year=$('#year'), kind=$('#kind');
const courses=[...new Set(questions.map(q=>q.subject))];courses.forEach(x=>course.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
[...new Set(questions.map(q=>q.year))].sort().forEach(x=>year.insertAdjacentHTML('beforeend',`<option>${x}</option>`));$('#totalStat').textContent=questions.length;
function ribbon(q){const s=q.steps.slice(0,4).map(x=>x.title);return `<div class="flowmini"><svg viewBox="0 0 720 88" role="img" aria-label="${esc(q.familyTitle)}步骤示意">${s.map((x,i)=>{let px=8+i*178;return `<g><rect x="${px}" y="16" width="154" height="52" rx="12" fill="${i===0?'#e4f2ef':'#fff'}" stroke="${i===0?'#65b5a9':'#b9ccd4'}"/><text x="${px+77}" y="47" text-anchor="middle" font-size="15" fill="#24465b">${esc(x.slice(0,12))}</text></g>${i<3?`<path d="M${px+157} 42h16m-6-6 6 6-6 6" stroke="#168b88" stroke-width="2" fill="none"/>`:''}`}).join('')}</svg></div>`}
function card(q){let mastered=localStorage.getItem('master-'+q.id)==='1';let fig=q.figures.length?`<div class="figurestrip">${q.figures.map(f=>`<img loading="lazy" src="assets/${esc(f)}" alt="教材图解：${esc(f.replace('.png',''))}">`).join('')}</div>`:'';
return `<article class="card" data-id="${q.id}"><div class="cardhead"><span class="qid">${q.id}${q.recall?'†':''}</span><span class="tag ${q.recall?'recall':''}">${esc(q.subject)} · ${esc(q.group)}</span></div><h3>${esc(q.familyTitle)}</h3><p class="summary">${esc(q.summary)}</p><div class="cardactions"><a class="openq" href="${q.source}" target="_blank" rel="noreferrer">打开真题原题 ↗</a><label class="master"><input type="checkbox" ${mastered?'checked':''} data-master="${q.id}">我能独立做</label></div><details><summary>展开逐步解析与图解</summary><div class="answer">${ribbon(q)}${fig}<div class="refline"><b>教材定位：</b>${esc(q.bookRef)}</div><h4>逐步解析</h4><ol>${q.steps.map(s=>`<li><b>${esc(s.title)}：</b>${esc(s.body)}</li>`).join('')}</ol><div class="check"><b>答案核对：</b>${esc(q.answerCheck)}</div><div class="pitfall"><b>易错提醒：</b>${esc(q.pitfall)}</div><div class="refline">具体题目数值、序列与选项以原题为准；<a href="${q.source}" target="_blank" rel="noreferrer">回查 ${q.id} 真题 ↗</a></div></div></details></article>`}
function render(){const term=search.value.trim().toLowerCase();const list=questions.filter(q=>(!course.value||q.subject===course.value)&&(!year.value||q.year===+year.value)&&(!kind.value||q.group===kind.value)&&(!term||(q.id+' '+q.summary+' '+q.familyTitle+' '+q.subject).toLowerCase().includes(term)));grid.innerHTML=list.length?list.map(card).join(''):'<div class="none">没有找到匹配题目，换个关键词试试。</div>';$('#resultCount').textContent=`显示 ${list.length} / ${questions.length} 题 · 未展开解析时答案保持遮住`;grid.querySelectorAll('[data-master]').forEach(el=>el.addEventListener('change',e=>localStorage.setItem('master-'+e.target.dataset.master,e.target.checked?'1':'0')))}
[search,course,year,kind].forEach(el=>el.addEventListener('input',render));$('#openAll').onclick=()=>grid.querySelectorAll('details').forEach(x=>x.open=true);$('#closeAll').onclick=()=>grid.querySelectorAll('details').forEach(x=>x.open=false);$('#randomBtn').onclick=()=>{const list=[...grid.querySelectorAll('.card')];if(!list.length)return;list[Math.floor(Math.random()*list.length)].scrollIntoView({behavior:'smooth',block:'center'});};
// Main mode tabs
for(const b of document.querySelectorAll('.tab'))b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel));});
render();

// Interactive demos
const demoNames=[['dijkstra','Dijkstra最短路'],['lru','LRU页面置换'],['cpu','CPU取指与执行'],['tcp','TCP三次握手'],['gbn','GBN超时重传'],['pv','PV同步缓冲区']];let current='dijkstra';
const menu=$('#demoMenu'),panel=$('#demoPanel');
menu.innerHTML=demoNames.map(([id,n],i)=>`<button data-demo="${id}" class="${i===0?'active':''}">${n}</button>`).join('');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.demo;menu.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderDemo()});
function controls(step,max,labels){return `<div class="demo-controls"><button class="primary" data-action="next">下一步</button><button data-action="reset">重置</button>${labels?`<span class="notice">${esc(labels)}</span>`:''}</div><div class="demostatus" id="demoStatus"></div>`}
function renderDemo(){if(current==='dijkstra')dijkstraDemo();else if(current==='lru')lruDemo();else if(current==='cpu')cpuDemo();else if(current==='tcp')tcpDemo();else if(current==='gbn')gbnDemo();else pvDemo()}
function dijkstraDemo(){let state=0;const stages=[['初始','S={1}；dist(2)=10，dist(5)=5，其余∞。'],['第1轮','选5；松弛后 dist(2)=8，dist(3)=14，dist(4)=7。'],['第2轮','选4；松弛后 dist(3)=13。'],['第3轮','选2；松弛后 dist(3)=9。'],['完成','选3；前驱链还原到目标点。']];
let nodes=[[1,90,90],[2,270,48],[3,270,150],[4,450,150],[5,450,48],[6,620,100]],edges=[[1,2,10],[1,5,5],[5,2,3],[5,3,9],[5,4,2],[2,3,1],[4,3,6],[4,6,2],[3,6,3],[5,6,8]];
panel.innerHTML=`<h2>Dijkstra：每轮只确定一个最近点</h2><p class="demohelp">教材示例图的简化演示。点“下一步”观察集合 S 和 dist 如何变化。</p><div class="demoarea"><svg class="demo-svg" viewBox="0 0 700 215"><g id="edges">${edges.map(([a,b,w])=>{let A=nodes.find(n=>n[0]===a),B=nodes.find(n=>n[0]===b);return `<line class="edge" data-edge="${a}-${b}" x1="${A[1]}" y1="${A[2]}" x2="${B[1]}" y2="${B[2]}"/><text x="${(A[1]+B[1])/2}" y="${(A[2]+B[2])/2-7}" fill="#526878" font-size="12">${w}</text>`}).join('')}</g>${nodes.map(([id,x,y])=>`<g class="node" id="node${id}"><circle cx="${x}" cy="${y}" r="24"/><text x="${x}" y="${y}">v${id}</text></g>`).join('')}</svg><div class="frame-row" id="distRow"></div>${controls(0,4,'绿色=已确定，橙色=本轮选择')}</div>`;
function update(){let [title,desc]=stages[state];$('#demoStatus').textContent=title+'：'+desc;nodes.forEach(([id])=>{let el=$('#node'+id);el.classList.toggle('fixed',state>0&&[1,5,4,2,3].slice(0,state+1).includes(id));el.classList.toggle('active',state>0&&[5,4,2,3][state-1]===id)});let rows=state===0?['0','10','∞','∞','5','∞']:state===1?['0','8','14','7','5','∞']:state===2?['0','8','13','7','5','∞']:state===3?['0','8','9','7','5','∞']:['0','8','9','7','5','∞'];$('#distRow').innerHTML=rows.map((x,i)=>`<div class="frame ${i===0?'active':''}">v${i+1}: ${x}</div>`).join('')}
panel.querySelector('[data-action=next]').onclick=()=>{state=Math.min(state+1,4);update()};panel.querySelector('[data-action=reset]').onclick=()=>{state=0;update()};update()}
function lruDemo(){let state=0;const seq=[7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1];function calc(n){let frames=[],last={},rows=[];for(let i=0;i<n;i++){let p=seq[i],hit=frames.includes(p),victim=null;if(!hit){if(frames.length<3)frames.push(p);else{victim=frames.slice().sort((a,b)=>last[a]-last[b])[0];frames[frames.indexOf(victim)]=p}}last[p]=i;rows.push({p,hit,frames:frames.slice(),victim})}return rows}
panel.innerHTML=`<h2>LRU：最近最久未使用页</h2><p class="demohelp">依次访问页面；命中时更新“最近使用”顺序，缺页时淘汰最久未使用项。</p><div class="demoarea"><div class="page-seq" id="pageSeq"></div><div class="frame-row" id="lruFrames"></div><div id="lruExplain" class="notice"></div>${controls(0,seq.length,'橙色=缺页，绿色=命中')}</div>`;
function update(){let rows=calc(state);$('#pageSeq').innerHTML=seq.map((p,i)=>`<span class="seqitem ${i===state-1?'current':''}">${p}</span>`).join('');let r=rows.at(-1);$('#lruFrames').innerHTML=[0,1,2].map((i)=>`<div class="frame ${r?(r.hit?'active':'fault'):''}">${r?.frames[i]??'—'}</div>`).join('');$('#lruExplain').textContent=!r?'从第一个访问开始。':`访问 ${r.p}：${r.hit?'命中，刷新最近使用位置。':r.victim===null?'缺页，放入空页框。':`缺页，淘汰最久未使用的 ${r.victim}。`}`;$('#demoStatus').textContent=`已处理 ${state} / ${seq.length} 次访问`}
panel.querySelector('[data-action=next]').onclick=()=>{state=Math.min(state+1,seq.length);update()};panel.querySelector('[data-action=reset]').onclick=()=>{state=0;update()};update()}
function cpuDemo(){let state=0;const labels=['PC→MAR','主存读→MDR','MDR→IR','寄存器→ALU','ALU结果→寄存器'];panel.innerHTML=`<h2>CPU：一条指令怎样走过数据通路</h2><p class="demohelp">用单总线加法指令作示意，注意每一拍由谁驱动总线、数据写到哪里。</p><div class="demoarea"><div class="datapath" id="dp">${labels.map((x,i)=>`<div class="dpnode" data-i="${i}">${x}</div>${i<4?'<div class="dparrow"></div>':''}`).join('')}</div>${controls(0,labels.length,'每步高亮当前微操作')}</div>`;function update(){$('#dp').querySelectorAll('.dpnode').forEach((n,i)=>{n.classList.toggle('active',i===state);n.classList.toggle('done',i<state)});$('#dp').querySelectorAll('.dparrow').forEach((a,i)=>a.classList.toggle('active',i<state));$('#demoStatus').textContent=state===labels.length?'写回完成：检查目的寄存器与PC。':`第 ${state+1} 拍：${labels[state]}`};panel.querySelector('[data-action=next]').onclick=()=>{state=Math.min(state+1,labels.length);update()};panel.querySelector('[data-action=reset]').onclick=()=>{state=0;update()};update()}
function tcpDemo(){let state=0;const msgs=['SYN：客户端请求连接','SYN+ACK：服务器确认并给出自己的序号','ACK：客户端确认，双方进入 ESTABLISHED'];panel.innerHTML=`<h2>TCP：三次握手</h2><p class="demohelp">逐个报文观察两端状态变化；SYN会消耗一个序号，纯ACK不消耗序号。</p><div class="demoarea"><div class="tcp-lanes"><div class="lane">客户端<br><span id="clientState">CLOSED</span></div><div class="lane">服务器<br><span id="serverState">LISTEN</span></div><div class="tcpmsgs" id="tcpMsgs"></div></div>${controls(0,3,'报文逐次出现')}</div>`;function update(){$('#tcpMsgs').innerHTML=msgs.slice(0,state).map((m,i)=>`<div class="msg ${i===1?'right':''} active"><span>${esc(m)}</span></div>`).join('');$('#clientState').textContent=state>=3?'ESTABLISHED':state>=2?'SYN-SENT':'CLOSED';$('#serverState').textContent=state>=3?'ESTABLISHED':state>=2?'SYN-RCVD':'LISTEN';$('#demoStatus').textContent=state===3?'连接建立；下一数据字节从各自序号继续。':`已展示 ${state} / 3 个握手报文`};panel.querySelector('[data-action=next]').onclick=()=>{state=Math.min(3,state+1);update()};panel.querySelector('[data-action=reset]').onclick=()=>{state=0;update()};update()}
function gbnDemo(){let state=0;const labels=['发送方发出 0、1、2、3','帧2丢失；接收方仍只累计确认到1','发送方超时：从最早未确认帧2开始重传','收到连续帧后ACK前移，发送窗口滑动'];panel.innerHTML=`<h2>GBN：丢帧后的回退重传</h2><p class="demohelp">GBN接收方只按序接收，累计确认；一个帧超时后，窗口内后续帧可能一起重传。</p><div class="demoarea"><div class="frame-row" id="gbnSend"></div><div class="frame-row" id="gbnRecv"></div>${controls(0,4,'上排=发送方，下排=接收方')}</div>`;function update(){$('#gbnSend').innerHTML=[0,1,2,3,4,5].map(i=>`<div class="frame ${state>=3&&i===2?'fault':state>=1&&i===2?'fault':''}">${state>=3&&i>=2&&i<=3?'重发 ':''}${i}</div>`).join('');$('#gbnRecv').innerHTML=[0,1,2,3].map(i=>`<div class="frame ${state>=3&&i>=2?'active':''}">${state===1&&i===2?'丢弃':state>=3&&i>=2?i:i<Math.max(0,state)?i:'—'}</div>`).join('');$('#demoStatus').textContent=state===0?'窗口可发送0–3。':labels[state-1]};panel.querySelector('[data-action=next]').onclick=()=>{state=Math.min(4,state+1);update()};panel.querySelector('[data-action=reset]').onclick=()=>{state=0;update()};update()}
function pvDemo(){let empty=3,full=0,mutex=1,buffer=0;panel.innerHTML=`<h2>PV：有界缓冲区同步</h2><p class="demohelp">模拟容量为3的缓冲区。生产者需要 empty 与 mutex；消费者需要 full 与 mutex。</p><div class="demoarea"><div class="semrow"><div class="sem"><b>empty</b><div id="emptyVal">3</div></div><div class="sem"><b>full</b><div id="fullVal">0</div></div><div class="sem"><b>mutex</b><div id="mutexVal">1</div></div><div class="sem"><b>缓冲区</b><div class="tokens" id="tokens"></div></div></div><div class="demo-controls"><button class="primary" id="produce">生产一个</button><button id="consume">消费一个</button><button id="pvReset">重置</button></div><div class="demostatus" id="pvStatus"></div></div>`;function update(msg){$('#emptyVal').textContent=empty;$('#fullVal').textContent=full;$('#mutexVal').textContent=mutex;$('#tokens').innerHTML=Array.from({length:3},(_,i)=>`<span class="token ${i>=buffer?'empty':''}"></span>`).join('');$('#pvStatus').textContent=msg||`缓冲区 ${buffer}/3；生产者等待empty，消费者等待full。`};$('#produce').onclick=()=>{if(empty===0){update('empty=0，生产者阻塞，不能覆盖未消费数据。');return}empty--;mutex--;buffer++;mutex++;full++;update('P(empty)→P(mutex)→写入→V(mutex)→V(full)。')};$('#consume').onclick=()=>{if(full===0){update('full=0，消费者阻塞，没有可取数据。');return}full--;mutex--;buffer--;mutex++;empty++;update('P(full)→P(mutex)→取出→V(mutex)→V(empty)。')};$('#pvReset').onclick=()=>{empty=3;full=0;mutex=1;buffer=0;update('已重置。')};update()}
renderDemo();
})();
</script>
</body>
</html>
